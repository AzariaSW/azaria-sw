name: CI

on:
  push:
    branches:
      - master
      - main
      - develop

  pull_request:
    branches:
      - master
      - main
      - develop

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema=apps/server/prisma/schema.prisma

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/server/prisma/schema.prisma

  frontend:
    name: Frontend Validation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --workspace=client

      - name: Build frontend
        run: npm run build --workspace=client
        env:
          VITE_API_URL: http://localhost:5000/api/v1
          VITE_UPLOAD_URL: http://localhost:5000/uploads
          VITE_APP_NAME: Azaria SW

  docker:
    name: Production Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        run: |
          docker build \
            -f apps/server/Dockerfile \
            -t azaria-sw-server:ci \
            .

      - name: Build client image
        run: |
          docker build \
            -f apps/client/Dockerfile \
            --build-arg VITE_API_URL=http://localhost:5000/api/v1 \
            --build-arg VITE_UPLOAD_URL=http://localhost:5000/uploads \
            --build-arg "VITE_APP_NAME=Azaria SW" \
            -t azaria-sw-client:ci \
            .
  deploy:
    needs:
      - backend
      - frontend
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploy backend
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Deploy frontend
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"